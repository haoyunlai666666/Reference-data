# 保活任务：Render 免费实例 15 分钟无访问会休眠，冷启动需 1 分钟左右。
# 按用户要求改为每天只 ping 一次（不再每 10 分钟 ping）。
# 时间设在北京时间 07:50（UTC 23:50），早于 08:00 的对账工作流：
# 早上钉钉日报送达时服务已被唤醒，点链接即可秒开。
# 注意：每天仅唤醒一次无法保证全天在线，白天无访问后仍可能休眠；
# 网页内置 10 次自动重试，冷启动时会显示"服务正在唤醒"并自动加载。
# 仓库为 public，GitHub Actions 对 public 仓库免费；每天的对账工作流
# 会提交 report.json，因此仓库始终有活动，本定时任务不会被 GitHub 自动停用。

name: 查询网页保活（每天一次）

on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 查询网页服务
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://reference-data.onrender.com/health)
          echo "health HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::保活 ping 返回异常状态码 $code"
          fi
